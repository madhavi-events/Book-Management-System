<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Book Management System</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="insert.html">Add Book</a>
            <a href="list.html">View Books</a>
            <a href="update.html">Update Book</a>
            <a href="delete.html">Delete Book</a>
        </nav>
    </header>

    <main class="container">

        <section class="page-title">
            <h2>Delete Book</h2>
            <p>Remove a book from your inventory using its Book ID.</p>
        </section>

        <section class="panel">

            <form id="deleteBookForm">

                <div class="form-group">
                    <label for="bookId">Book ID</label>
                    <input type="number" id="bookId" name="bookId"
                           placeholder="Enter Book ID" min="1" required>
                </div>

                <button type="submit">Delete Book</button>

                <p id="message" class="message"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>Book Management System | Manage Your Books Easily</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
