<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Books</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Book Management System</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="insert.html">Add Book</a>
            <a href="list.html">View Books</a>
            <a href="update.html">Update Book</a>
            <a href="delete.html">Delete Book</a>
        </nav>
    </header>

    <main class="container">

        <section class="page-title">
            <h2>All Books</h2>
            <p>View and search your book inventory.</p>
        </section>

        <section class="panel">

            <div class="form-group">
                <label for="searchBook">Search Books</label>
                <input type="text" id="searchBook"
                       placeholder="Search by title or author">
            </div>

            <br>

            <div class="form-group">
                <label for="filterCategory">Filter by Category</label>
                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="History">History</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <br>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Book ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                        </tr>
                    </thead>

                    <tbody id="bookTableBody">
                        <tr>
                            <td colspan="6">Loading books...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p id="message" class="message"></p>

        </section>

    </main>

    <footer>
        <p>Book Management System | Manage Your Books Easily</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
